<html lang="id">
    <!-- Theme Loader Script -->
<script>
    // Load saved theme
    document.addEventListener('DOMContentLoaded', function() {
        const savedTheme = localStorage.getItem('khusnul_theme');
        if (savedTheme) {
            try {
                const theme = JSON.parse(savedTheme);
                
                // Apply CSS variables
                document.documentElement.style.setProperty('--primary-color', theme.primaryColor);
                document.documentElement.style.setProperty('--secondary-color', theme.secondaryColor);
                document.documentElement.style.setProperty('--accent-color', theme.accentColor);
                document.documentElement.style.setProperty('--heading-font', theme.headingFont);
                document.documentElement.style.setProperty('--body-font', theme.bodyFont);
                
                // Apply background
                if (theme.backgroundType === 'solid') {
                    document.body.style.background = theme.backgroundColor;
                } else if (theme.backgroundType === 'pattern' || theme.backgroundType === 'gradient') {
                    document.body.style.background = theme.backgroundCSS;
                }
                
                // Apply fonts
                document.body.style.fontFamily = `'${theme.bodyFont}', sans-serif`;
                
                // Apply to headings
                document.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(heading => {
                    heading.style.fontFamily = `'${theme.headingFont}', cursive`;
                });
                
            } catch (e) {
                console.log('Error applying theme');
            }
        }
    });
</script>

        // Variabel global
        let currentCategory = 'all';
        let currentSearch = '';

        // Render tools ke grid
        function renderTools() {
            const toolsGrid = document.getElementById('toolsGrid');
            
            // Filter tools berdasarkan kategori dan pencarian
            let filteredTools = kitchenTools;
            
            if (currentCategory !== 'all') {
                filteredTools = filteredTools.filter(tool => tool.category === currentCategory);
            }
            
            if (currentSearch) {
                const searchLower = currentSearch.toLowerCase();
                filteredTools = filteredTools.filter(tool => 
                    tool.english.toLowerCase().includes(searchLower) ||
                    tool.indonesia.toLowerCase().includes(searchLower) ||
                    tool.category.toLowerCase().includes(searchLower)
                );
            }
            
            // Update counter
            document.getElementById('toolCount').textContent = filteredTools.length;
            document.getElementById('counterText').textContent = 
                filteredTools.length === 1 ? 'kitchen tool found' : 'kitchen tools found';
            
            // Kosongkan grid
            toolsGrid.innerHTML = '';
            
            // Jika tidak ada hasil
            if (filteredTools.length === 0) {
                toolsGrid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search" style="color: #FF9A9E;"></i>
                        <h3 style="color: #333; margin-bottom: 10px;">No tools found</h3>
                        <p style="color: #666;">Try a different search or category</p>
                    </div>
                `;
                return;
            }
            
            // Tambahkan setiap tool ke grid
            filteredTools.forEach(tool => {
                const toolElement = document.createElement('div');
                toolElement.className = 'tool-card';
                toolElement.innerHTML = `
                    <div class="tool-emoji">${tool.emoji}</div>
                    <div class="tool-name">${tool.english}</div>
                    <div class="tool-translation">${tool.indonesia}</div>
                    <div class="tool-category">${tool.category}</div>
                `;
                
                // Klik untuk mendengarkan pengucapan
                toolElement.addEventListener('click', function() {
                    speakEnglish(tool.english);
                    
                    // Efek visual saat diklik
                    this.style.transform = 'scale(0.95)';
                    this.style.boxShadow = '0 5px 15px rgba(255, 154, 158, 0.3)';
                    
                    setTimeout(() => {
                        this.style.transform = '';
                        this.style.boxShadow = '';
                    }, 200);
                });
                
                toolsGrid.appendChild(toolElement);
            });
        }

        // Fungsi untuk berbicara (text-to-speech)
        function speakEnglish(text) {
            if ('speechSynthesis' in window) {
                const speech = new SpeechSynthesisUtterance(text);
                speech.lang = 'en-US';
                speech.rate = 0.8;
                speech.pitch = 1;
                
                // Hentikan pembicaraan sebelumnya
                window.speechSynthesis.cancel();
                
                // Mulai berbicara
                window.speechSynthesis.speak(speech);
                
                // Tampilkan notifikasi kecil
                showSpeakingNotification(text);
            } else {
                alert(`Pronunciation: ${text}`);
            }
        }

        // Notifikasi saat berbicara
        function showSpeakingNotification(text) {
            // Hapus notifikasi sebelumnya
            const existingNotification = document.querySelector('.speaking-notification');
            if (existingNotification) {
                existingNotification.remove();
            }
            
            // Buat notifikasi baru
            const notification = document.createElement('div');
            notification.className = 'speaking-notification';
            notification.innerHTML = `
                <i class="fas fa-volume-up" style="color: #FF9A9E;"></i>
                <span>Speaking: "<strong>${text}</strong>"</span>
            `;
            
            // Style notifikasi
            notification.style.cssText = `
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: white;
                padding: 12px 20px;
                border-radius: 50px;
                box-shadow: 0 10px 30px rgba(0,0,0,0.2);
                display: flex;
                align-items: center;
                gap: 10px;
                z-index: 1000;
                animation: slideUp 0.3s ease;
                border: 2px solid #FF9A9E;
            `;
            
            document.body.appendChild(notification);
            
            // Hapus setelah 2 detik
            setTimeout(() => {
                notification.style.animation = 'slideDown 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            }, 2000);
        }

        // Tambahkan style untuk animasi
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideUp {
                from { transform: translate(-50%, 100%); opacity: 0; }
                to { transform: translate(-50%, 0); opacity: 1; }
            }
            
            @keyframes slideDown {
                from { transform: translate(-50%, 0); opacity: 1; }
                to { transform: translate(-50%, 100%); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        // Fungsi filter kategori
        function setupCategoryFilters() {
            const filterButtons = document.querySelectorAll('.filter-btn');
            
            filterButtons.forEach(button => {
                button.addEventListener('click', function() {
                    // Hapus active dari semua tombol
                    filterButtons.forEach(btn => btn.classList.remove('active'));
                    
                    // Tambah active ke tombol yang diklik
                    this.classList.add('active');
                    
                    // Update kategori
                    currentCategory = this.dataset.category;
                    
                    // Render ulang tools
                    renderTools();
                });
            });
        }

        // Fungsi search
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            
            searchInput.addEventListener('input', function() {
                currentSearch = this.value.trim();
                renderTools();
            });
            
            // Debounce untuk performance
            let searchTimeout;
            searchInput.addEventListener('input', function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    currentSearch = this.value.trim();
                    renderTools();
                }, 300);
            });
        }

        // Inisialisasi
        document.addEventListener('DOMContentLoaded', function() {
            renderTools();
            setupCategoryFilters();
            setupSearch();
            
            // Update counter awal
            document.getElementById('toolCount').textContent = kitchenTools.length;
            document.getElementById('counterText').textContent = 'kitchen tools total';
            
            // Efek masuk untuk cards
            setTimeout(() => {
                const cards = document.querySelectorAll('.tool-card');
                cards.forEach((card, index) => {
                    card.style.opacity = '0';
                    card.style.transform = 'translateY(20px)';
                    
                    setTimeout(() => {
                        card.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                        card.style.opacity = '1';
                        card.style.transform = 'translateY(0)';
                    }, index * 50); // Stagger effect
                });
            }, 100);
        });
    </script>
