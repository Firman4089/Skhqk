<!DOCTYPE html>
<html lang="id">
    <!-- Theme Loader Script -->
<script>
    // Load saved theme
    document.addEventListener('DOMContentLoaded', function() {
        const savedTheme = localStorage.getItem('khusnul_theme');
        if (savedTheme) {
            try {
                const theme = JSON.parse(savedTheme);
                
                // Apply CSS variables
                document.documentElement.style.setProperty('--primary-color', theme.primaryColor);
                document.documentElement.style.setProperty('--secondary-color', theme.secondaryColor);
                document.documentElement.style.setProperty('--accent-color', theme.accentColor);
                document.documentElement.style.setProperty('--heading-font', theme.headingFont);
                document.documentElement.style.setProperty('--body-font', theme.bodyFont);
                
                // Apply background
                if (theme.backgroundType === 'solid') {
                    document.body.style.background = theme.backgroundColor;
                } else if (theme.backgroundType === 'pattern' || theme.backgroundType === 'gradient') {
                    document.body.style.background = theme.backgroundCSS;
                }
                
                // Apply fonts
                document.body.style.fontFamily = `'${theme.bodyFont}', sans-serif`;
                
                // Apply to headings
                document.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(heading => {
                    heading.style.fontFamily = `'${theme.headingFont}', cursive`;
                });
                
            } catch (e) {
                console.log('Error applying theme');
            }
        }
    });
</script>

                grid-template-columns: 1fr;

                align-items: stretch;

                justify-content: space-between;
            }
            
            .save-btn, .cancel-btn {
                flex: 1;
                justify-content: center;

<body>
    <div class="page-container">
        <a href="index.html" class="back-button">
            <i class="fas fa-arrow-left"></i> Back to Menu
        </a>
        
        <div class="notes-container">
            <!-- Notes Header -->
            <div class="notes-header">
                <h1 class="notes-title">My Notes ✨</h1>
                <p class="notes-subtitle">Tulis, beresin, & simpen semua catatan kamu~ 🌸</p>
                
                <div class="notes-stats">
                    <div class="note-stat">
                        <div class="stat-number" id="totalNotes">0</div>
                        <div class="stat-text">Total Catatan</div>
                    </div>
                    <div class="note-stat">
                        <div class="stat-number" id="pinnedNotes">0</div>
                        <div class="stat-text">Disematkan</div>
                    </div>
                    <div class="note-stat">
                        <div class="stat-number" id="totalChars">0</div>
                        <div class="stat-text">Karakter</div>
                    </div>
                </div>
            </div>
            
            <!-- Controls Bar -->
            <div class="controls-bar">
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Cari catatan...">
                </div>
                
                <div class="filter-buttons">
                    <button class="filter-btn active" data-category="all">
                        <i class="fas fa-layer-group"></i> Semua
                    </button>
                    <button class="filter-btn" data-category="personal">
                        <i class="fas fa-heart"></i> Pribadi
                    </button>
                    <button class="filter-btn" data-category="work">
                        <i class="fas fa-briefcase"></i> Kerja
                    </button>
                    <button class="filter-btn" data-category="ideas">
                        <i class="fas fa-lightbulb"></i> Ide
                    </button>
                    <button class="filter-btn" data-category="pinned">
                        <i class="fas fa-thumbtack"></i> disematkan
                    </button>
                </div>
                
                <button class="new-note-btn" onclick="openEditor()">
                    <i class="fas fa-plus"></i> Catatan baru
                </button>
            </div>
            
            <!-- Notes Grid -->
            <div class="notes-grid" id="notesGrid">
                <!-- Notes will be loaded here -->
                <div class="empty-state">
                    <i class="fas fa-sticky-note"></i>
                    <h3>Belum ada catatan</h3>
                    <p>Buat catatan pertama kamu!</p>
                    <button class="new-note-btn" onclick="openEditor()" style="margin-top: 20px;">
                        <i class="fas fa-plus"></i> Buat Catatan Pertama
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Note Editor Modal -->
    <div class="editor-modal" id="editorModal">
        <div class="editor-container">
            <div class="editor-header">
                <h2 class="editor-title" id="editorTitle">Catatan Baru</h2>
                <button class="editor-close" onclick="closeEditor()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="editor-body">
                <div class="editor-input-group">
                    <label class="editor-label">Judul</label>
                    <input type="text" id="noteTitle" class="title-input" placeholder="Note title..." maxlength="100">
                </div>
                
                <div class="editor-input-group">
                    <label class="editor-label">Kategori</label>
                    <div class="category-select">
                        <div class="category-option" data-category="pribadi" onclick="selectCategory('pribadi')">
                            <i class="fas fa-heart"></i> Pribadi
                        </div>
                        <div class="category-option" data-category="work" onclick="selectCategory('work')">
                            <i class="fas fa-briefcase"></i> Kerja
                        </div>
                        <div class="category-option" data-category="ideas" onclick="selectCategory('ideas')">
                            <i class="fas fa-lightbulb"></i> Ide
                        </div>
                        <div class="category-option" data-category="reminders" onclick="selectCategory('reminders')">
                            <i class="fas fa-bell"></i> Pengingat
                        </div>
                        <div class="category-option" data-category="other" onclick="selectCategory('other')">
                            <i class="fas fa-ellipsis-h"></i>Lainnya
                        </div>
                    </div>
                </div>
                
                <div class="editor-input-group">
                    <label class="editor-label">Content</label>
                    <textarea id="noteContent" class="content-textarea" placeholder="Write your note here..." maxlength="5000"></textarea>
                </div>
            </div>
            
            <div class="editor-footer">
                <div class="editor-actions">
                    <button class="save-btn" onclick="saveNote()">
                        <i class="fas fa-save"></i> Simpan catatan
                    </button>
                    <button class="cancel-btn" onclick="closeEditor()">
                        <i class="fas fa-times"></i> Batal
                    </button>
                </div>
                <div class="char-count">
                    Karakter: <span id="charCount">0</span>/5000
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== NOTES DATA & STATE =====
        let notes = JSON.parse(localStorage.getItem('khusnul_notes')) || [];
        let currentFilter = 'all';
        let currentSearch = '';
        let editingNoteId = null;
        let selectedCategory = 'personal';
        
        // Sample notes for first time users
        const sampleNotes = [
            {
                id: 1,
                title: "Welcome to Notes! ✨",
                content: "Ini tempat catatan pribadi, Kamu bisa nulis apa aja di sini.",
                category: "personal",
                pinned: true,
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString(),
                charCount: 142
            },
            {
                id: 2,
                title: "Project Ideas 💡",
                content: "1. Personal blog website\n2. Recipe collection app\n3. Mood tracker\n4. Travel journal\n5. Learning progress tracker",
                category: "ide",
                pinned: false,
                createdAt: new Date(Date.now() - 86400000).toISOString(), // 1 day ago
                updatedAt: new Date(Date.now() - 86400000).toISOString(),
                charCount: 112
            },
            {
                id: 3,
                title: "Shopping List 🛍️",
                content: "- Susu\n- Telur\n- Roti\n-",
                category: "pengingat",
                pinned: true,
                createdAt: new Date(Date.now() - 172800000).toISOString(), // 2 days ago
                updatedAt: new Date(Date.now() - 172800000).toISOString(),
                charCount: 58
            }
        ];
        
        // ===== INITIALIZE =====
        document.addEventListener('DOMContentLoaded', function() {
            // Load notes or initialize with sample
            if (notes.length === 0) {
                notes = sampleNotes;
                saveNotes();
            }
            
            setupEventListeners();
            renderNotes();
            updateStats();
        });
        
        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            // Search input
            document.getElementById('searchInput').addEventListener('input', function(e) {
                currentSearch = this.value.toLowerCase().trim();
                renderNotes();
            });
            
            // Filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    // Update active button
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Update filter
                    currentFilter = this.dataset.category;
                    renderNotes();
                });
            });
            
            // Character count for textarea
            document.getElementById('noteContent').addEventListener('input', function() {
                updateCharCount();
            });
            
            // Auto-save on title/content change (optional)
            let saveTimeout;
            document.getElementById('noteTitle').addEventListener('input', function() {
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(updateCharCount, 500);
            });
            
            document.getElementById('noteContent').addEventListener('input', function() {
                clearTimeout(saveTimeout);
                saveTimeout = setTimeout(updateCharCount, 500);
            });
            
            // Enter key to save
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && e.ctrlKey && document.getElementById('editorModal').classList.contains('active')) {
                    saveNote();
                }
                if (e.key === 'Escape' && document.getElementById('editorModal').classList.contains('active')) {
                    closeEditor();
                }
            });
        }
        
        // ===== RENDER NOTES =====
        function renderNotes() {
            const notesGrid = document.getElementById('notesGrid');
            
            // Filter notes
            let filteredNotes = notes;
            
            // Apply category filter
            if (currentFilter !== 'all') {
                if (currentFilter === 'pinned') {
                    filteredNotes = filteredNotes.filter(note => note.pinned);
                } else {
                    filteredNotes = filteredNotes.filter(note => note.category === currentFilter);
                }
            }
            
            // Apply search filter
            if (currentSearch) {
                filteredNotes = filteredNotes.filter(note => 
                    note.title.toLowerCase().includes(currentSearch) ||
                    note.content.toLowerCase().includes(currentSearch) ||
                    note.category.toLowerCase().includes(currentSearch)
                );
            }
            
            // Sort: pinned first, then by updated date
            filteredNotes.sort((a, b) => {
                if (a.pinned && !b.pinned) return -1;
                if (!a.pinned && b.pinned) return 1;
                return new Date(b.updatedAt) - new Date(a.updatedAt);
            });
            
            // Clear grid
            notesGrid.innerHTML = '';
            
            // Show empty state if no notes
            if (filteredNotes.length === 0) {
                let message = '';
                if (currentSearch) {
                    message = `No notes found for "${currentSearch}"`;
                } else if (currentFilter !== 'all') {
                    message = `No ${currentFilter} notes yet`;
                } else {
                    message = 'No notes yet';
                }
                
                notesGrid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <h3>${message}</h3>
                        <p>${currentSearch || currentFilter !== 'all' ? 'Try a different search or filter' : 'Create your first note!'}</p>
                        ${!currentSearch && currentFilter === 'all' ? 
                            `<button class="new-note-btn" onclick="openEditor()" style="margin-top: 20px;">
                                <i class="fas fa-plus"></i> Create First Note
                            </button>` : ''
                        }
                    </div>
                `;
                return;
            }
            
            // Render each note
            filteredNotes.forEach(note => {
                const noteCard = document.createElement('div');
                noteCard.className = `note-card ${note.pinned ? 'pinned' : ''}`;
                noteCard.dataset.id = note.id;
                
                // Format date
                const date = new Date(note.updatedAt);
                const formattedDate = date.toLocaleDateString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    year: date.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined
                });
                
                // Get category icon
                const categoryIcons = {
                    pribadi: 'fas fa-heart',
                    kerja: 'fas fa-briefcase',
                    ide: 'fas fa-lightbulb',
                    pengingat: 'fas fa-bell',
                    other: 'fas fa-ellipsis-h'
                };
                
                // Truncate content for preview
                const previewContent = note.content.length > 200 
                    ? note.content.substring(0, 200) + '...' 
                    : note.content;
                
                noteCard.innerHTML = `
                    <div class="note-header">
                        <div class="note-title" title="${note.title}">${note.title}</div>
                        <div class="note-actions">
                            <button class="action-btn pin-btn" onclick="togglePin(${note.id})" title="${note.pinned ? 'Unpin' : 'Pin'}">
                                <i class="fas fa-thumbtack"></i>
                            </button>
                            <button class="action-btn edit-btn" onclick="editNote(${note.id})" title="Edit">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="action-btn delete-btn" onclick="deleteNote(${note.id})" title="Delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="note-category category-${note.category}" title="${note.category}">
                        <i class="${categoryIcons[note.category]}"></i> ${note.category.charAt(0).toUpperCase() + note.category.slice(1)}
                    </div>
                    
                    <div class="note-content">${formatNoteContent(previewContent)}</div>
                    
                    <div class="note-footer">
                        <div class="note-date">
                            <i class="far fa-clock"></i> ${formattedDate}
                        </div>
                        <div class="note-length">
                            <i class="fas fa-font"></i> ${note.charCount} chars
                        </div>
                    </div>
                `;
                
                notesGrid.appendChild(noteCard);
            });
        }
        
        // ===== EDITOR FUNCTIONS =====
        function openEditor(noteId = null) {
            const modal = document.getElementById('editorModal');
            const titleInput = document.getElementById('noteTitle');
            const contentInput = document.getElementById('noteContent');
            
            // Reset form
            titleInput.value = '';
            contentInput.value = '';
            selectedCategory = 'personal';
            editingNoteId = noteId;
            
            // Update category selection
            document.querySelectorAll('.category-option').forEach(option => {
                option.classList.remove('selected');
                if (option.dataset.category === selectedCategory) {
                    option.classList.add('selected');
                }
            });
            
            // If editing existing note, load data
            if (noteId) {
                const note = notes.find(n => n.id === noteId);
                if (note) {
                    document.getElementById('editorTitle').textContent = 'Edit Note';
                    titleInput.value = note.title;
                    contentInput.value = note.content;
                    selectedCategory = note.category;
                    
                    // Update category selection
                    document.querySelectorAll('.category-option').forEach(option => {
                        option.classList.remove('selected');
                        if (option.dataset.category === selectedCategory) {
                            option.classList.add('selected');
                        }
                    });
                }
            } else {
                document.getElementById('editorTitle').textContent = 'New Note';
            }
            
            // Show modal
            modal.classList.add('active');
            titleInput.focus();
            updateCharCount();
        }
        
        function closeEditor() {
            if (document.getElementById('noteTitle').value.trim() || document.getElementById('noteContent').value.trim()) {
                if (!confirm('You have unsaved changes. Close without saving?')) {
                    return;
                }
            }
            
            document.getElementById('editorModal').classList.remove('active');
            editingNoteId = null;
        }
        
        function selectCategory(category) {
            selectedCategory = category;
            
            // Update UI
            document.querySelectorAll('.category-option').forEach(option => {
                option.classList.remove('selected');
                if (option.dataset.category === category) {
                    option.classList.add('selected');
                }
            });
        }
        
        function updateCharCount() {
            const content = document.getElementById('noteContent').value;
            const charCount = content.length;
            document.getElementById('charCount').textContent = charCount;
            
            // Change color if near limit
            const countElement = document.getElementById('charCount');
            if (charCount > 4500) {
                countElement.style.color = '#FF6B6B';
                countElement.style.fontWeight = 'bold';
            } else if (charCount > 4000) {
                countElement.style.color = '#FFD166';
            } else {
                countElement.style.color = '#666';
                countElement.style.fontWeight = 'normal';
            }
        }
        
        // ===== CRUD OPERATIONS =====
        function saveNote() {
            const title = document.getElementById('noteTitle').value.trim();
            const content = document.getElementById('noteContent').value.trim();
            
            // Validation
            if (!title) {
                showNotification('Please enter a title!', 'error');
                document.getElementById('noteTitle').focus();
                return;
            }
            
            if (!content) {
                showNotification('Please enter note content!', 'error');
                document.getElementById('noteContent').focus();
                return;
            }
            
            const now = new Date().toISOString();
            const charCount = content.length;
            
            if (editingNoteId) {
                // Update existing note
                const noteIndex = notes.findIndex(n => n.id === editingNoteId);
                if (noteIndex !== -1) {
                    notes[noteIndex] = {
                        ...notes[noteIndex],
                        title: title,
                        content: content,
                        category: selectedCategory,
                        updatedAt: now,
                        charCount: charCount
                    };
                    
                    showNotification('Note updated successfully!', 'success');
                }
            } else {
                // Create new note
                const newNote = {
                    id: Date.now(), // Simple ID generation
                    title: title,
                    content: content,
                    category: selectedCategory,
                    pinned: false,
                    createdAt: now,
                    updatedAt: now,
                    charCount: charCount
                };
                
                notes.unshift(newNote); // Add to beginning
                showNotification('Note created successfully!', 'success');
            }
            
            // Save and update UI
            saveNotes();
            renderNotes();
            updateStats();
            closeEditor();
        }
        
        function editNote(noteId) {
            openEditor(noteId);
        }
        
        function deleteNote(noteId) {
            if (!confirm('Are you sure you want to delete this note?')) return;
            
            notes = notes.filter(note => note.id !== noteId);
            saveNotes();
            renderNotes();
            updateStats();
            
            showNotification('Catatan Dihapus!', 'success');
        }
        
        function togglePin(noteId) {
            const noteIndex = notes.findIndex(n => n.id === noteId);
            if (noteIndex !== -1) {
                notes[noteIndex].pinned = !notes[noteIndex].pinned;
                notes[noteIndex].updatedAt = new Date().toISOString();
                
                saveNotes();
                renderNotes();
                updateStats();
                
                showNotification(notes[noteIndex].pinned ? 'Catatan Disematkan!' : 'Catatan Tidak Disematkan!', 'success');
            }
        }
        
        // ===== UTILITY FUNCTIONS =====
        function saveNotes() {
            localStorage.setItem('khusnul_notes', JSON.stringify(notes));
        }
        
        function updateStats() {
            const totalNotes = notes.length;
            const pinnedNotes = notes.filter(n => n.pinned).length;
            const totalChars = notes.reduce((sum, note) => sum + (note.charCount || 0), 0);
            
            document.getElementById('totalNotes').textContent = totalNotes;
            document.getElementById('pinnedNotes').textContent = pinnedNotes;
            document.getElementById('totalChars').textContent = totalChars.toLocaleString();
        }
        
        function formatNoteContent(content) {
            // Replace newlines with <br> and URLs with links
            return content
                .replace(/\n/g, '<br>')
                .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color: #C9A9E8; text-decoration: underline;">$1</a>');
        }
        
        function showNotification(message, type = 'info') {
            // Create notification element
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            
            let icon = 'fas fa-info-circle';
            let color = '#C9A9E8';
            
            if (type === 'success') {
                icon = 'fas fa-check-circle';
                color = '#4cd964';
            } else if (type === 'error') {
                icon = 'fas fa-exclamation-circle';
                color = '#FF6B6B';
            }
            
            notification.innerHTML = `
                <i class="${icon}" style="color: ${color};"></i>
                <span>${message}</span>
            `;
            
            // Add styles if not exists
            if (!document.querySelector('#notification-styles')) {
                const style = document.createElement('style');
                style.id = 'notification-styles';
                style.textContent = `
                    .notification {
                        position: fixed;
                        top: 20px;
                        right: 20px;
                        background: white;
                        padding: 15px 25px;
                        border-radius: 15px;
                        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
                        display: flex;
                        align-items: center;
                        gap: 15px;
                        z-index: 10000;
                        transform: translateX(150%);
                        transition: transform 0.3s ease;
                        border-left: 4px solid #C9A9E8;
                    }
                    .notification.success { border-left-color: #4cd964; }
                    .notification.error { border-left-color: #FF6B6B; }
                    .notification.show { transform: translateX(0); }
                    .notification i { font-size: 1.5rem; }
                    @media (max-width: 768px) {
                        .notification {
                            left: 20px;
                            right: 20px;
                            transform: translateY(-150%);
                        }
                        .notification.show { transform: translateY(0); }
                    }
                `;
                document.head.appendChild(style);
            }
            
            document.body.appendChild(notification);
            
            setTimeout(() => notification.classList.add('show'), 10);
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }
        
        // Export notes function (bonus feature)
        function exportNotes() {
            const dataStr = JSON.stringify(notes, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            
            const exportFileDefaultName = `notes-backup-${new Date().toISOString().split('T')[0]}.json`;
            
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
            
            showNotification('Notes exported successfully!', 'success');
        }
        
        // Import notes function (bonus feature)
        function importNotes() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            
            input.onchange = function(e) {
                const file = e.target.files[0];
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    try {
                        const importedNotes = JSON.parse(e.target.result);
                        if (Array.isArray(importedNotes)) {
                            notes = importedNotes;
                            saveNotes();
                            renderNotes();
                            updateStats();
                            showNotification('Notes imported successfully!', 'success');
                        } else {
                            showNotification('Invalid notes file format!', 'error');
                        }
                    } catch (error) {
                        showNotification('Error reading notes file!', 'error');
                    }
                };
                
                reader.readAsText(file);
            };
            
            input.click();
        }
    </script>
</body>
</html>
