<!DOCTYPE html>
<html lang="id">
    <!-- Theme Loader Script -->
<script>
    // Load saved theme
    document.addEventListener('DOMContentLoaded', function() {
        const savedTheme = localStorage.getItem('khusnul_theme');
        if (savedTheme) {
            try {
                const theme = JSON.parse(savedTheme);
                
                // Apply CSS variables
                document.documentElement.style.setProperty('--primary-color', theme.primaryColor);
                document.documentElement.style.setProperty('--secondary-color', theme.secondaryColor);
                document.documentElement.style.setProperty('--accent-color', theme.accentColor);
                document.documentElement.style.setProperty('--heading-font', theme.headingFont);
                document.documentElement.style.setProperty('--body-font', theme.bodyFont);
                
                // Apply background
                if (theme.backgroundType === 'solid') {
                    document.body.style.background = theme.backgroundColor;
                } else if (theme.backgroundType === 'pattern' || theme.backgroundType === 'gradient') {
                    document.body.style.background = theme.backgroundCSS;
                }
                
                // Apply fonts
                document.body.style.fontFamily = `'${theme.bodyFont}', sans-serif`;
                
                // Apply to headings
                document.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(heading => {
                    heading.style.fontFamily = `'${theme.headingFont}', cursive`;
                });
                
            } catch (e) {
                console.log('Error applying theme');
            }
        }
    });
</script>

<!-- Tambah di CSS global (style.css) di bagian atas: -->
<style>
    :root {
        --primary-color: #C9A9E8;
        --secondary-color: #D8BFD8;
        --accent-color: #FF9A9E;
        --heading-font: 'Dancing Script', cursive;
        --body-font: 'Poppins', sans-serif;
    }
    
    /* Update existing styles to use variables */
    .back-button {
        background: var(--primary-color);
        color: white;
    }
    
    .card-icon {
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
    }
    
    /* Add more variable-based styles as needed */
</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List - Project Khusnul</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="page-container">
        <a href="index.html" class="back-button" onclick="return handleBackClick()">
    <i class="fas fa-arrow-left"></i> Back to Menu
</a>
        
        <div class="page-header">
            <h1><i class="fas fa-tasks"></i> Smart To-Do List</h1>
            <p>Tulis tugas-tugas kamu di sini</p>
        </div>
        
        <div class="todo-container">
            <div class="input-group">
                <input type="text" id="todo-input" placeholder="Buat tugas baru yuk!">
                <button class="add-btn" onclick="addTodo()">
                    <i class="fas fa-plus"></i> Add Task
                </button>
            </div>
            
            <div class="todo-stats" id="todoStats">
                <!-- Stats akan diupdate via JavaScript -->
            </div>
            
            <ul class="todo-list" id="todoList">
                <!-- Tasks akan dimuat via JavaScript -->
            </ul>
            
            <div class="text-center mt-30">
                <button onclick="clearAllTasks()" style="background: #FF6B6B; color: white; border: none; padding: 12px 25px; border-radius: 50px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 10px;">
                    <i class="fas fa-trash"></i> Clear All Tasks
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Load todos dari localStorage
        let todos = JSON.parse(localStorage.getItem('khusnul_todos')) || [];
        let editingId = null;

        // Update stats
        function updateStats() {
            const total = todos.length;
            const completed = todos.filter(t => t.completed).length;
            const pending = total - completed;
            
            document.getElementById('todoStats').innerHTML = `
                <div class="stat-item">
                    <span class="stat-number" style="color: #667eea;">${total}</span>
                    <span class="stat-label">Total</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" style="color: #4cd964;">${completed}</span>
                    <span class="stat-label">Completed</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" style="color: #FFD166;">${pending}</span>
                    <span class="stat-label">Pending</span>
                </div>
            `;
            
            // Update count di menu utama
            localStorage.setItem('todo_count', total);
        }

        // Render todos
        function renderTodos() {
            const todoList = document.getElementById('todoList');
            
            if (todos.length === 0) {
                todoList.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-clipboard-list"></i>
                        <h3>No tasks yet</h3>
                        <p>Add your first task to get started!</p>
                    </div>
                `;
                return;
            }
            
            todoList.innerHTML = todos.map(todo => `
                <li class="todo-item ${todo.completed ? 'completed' : ''}" data-id="${todo.id}">
                    <input type="checkbox" class="todo-checkbox" ${todo.completed ? 'checked' : ''} 
                           onchange="toggleTodo(${todo.id})">
                    
                    ${editingId === todo.id ? `
                        <input type="text" class="todo-text" id="edit-input-${todo.id}" value="${todo.text}" 
                               style="background: white; border: 2px solid #A1C4FD; padding: 8px 15px; border-radius: 10px; width: 100%;">
                    ` : `
                        <div class="todo-text">${todo.text}</div>
                    `}
                    
                    <div class="todo-actions">
                        ${editingId === todo.id ? `
                            <button class="action-btn save-btn" onclick="saveEdit(${todo.id})">
                                <i class="fas fa-check"></i>
                            </button>
                            <button class="action-btn delete-btn" onclick="cancelEdit()">
                                <i class="fas fa-times"></i>
                            </button>
                        ` : `
                            <button class="action-btn edit-btn" onclick="startEdit(${todo.id})">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="action-btn delete-btn" onclick="deleteTodo(${todo.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        `}
                    </div>
                </li>
            `).join('');
        }

        // Add new todo
        function addTodo() {
            const input = document.getElementById('todo-input');
            const text = input.value.trim();
            
            if (!text) {
                showNotification('Please enter a task!', 'error');
                return;
            }
            
            const newTodo = {
                id: Date.now(),
                text: text,
                completed: false,
                createdAt: new Date().toLocaleString()
            };
            
            todos.unshift(newTodo);
            saveTodos();
            renderTodos();
            updateStats();
            input.value = '';
            
            showNotification('Task added successfully!');
            
            // Scroll ke atas
            document.getElementById('todoList').scrollIntoView({ behavior: 'smooth' });
        }

        // Toggle complete status
        function toggleTodo(id) {
            todos = todos.map(todo => 
                todo.id === id ? {...todo, completed: !todo.completed} : todo
            );
            saveTodos();
            renderTodos();
            updateStats();
            
            const todo = todos.find(t => t.id === id);
            showNotification(todo.completed ? 'Task completed!' : 'Task marked as pending');
        }

        // Start editing
        function startEdit(id) {
            editingId = id;
            renderTodos();
            
            // Focus on input
            setTimeout(() => {
                const editInput = document.getElementById(`edit-input-${id}`);
                if (editInput) {
                    editInput.focus();
                    editInput.select();
                }
            }, 100);
        }

        // Save edit
        function saveEdit(id) {
            const editInput = document.getElementById(`edit-input-${id}`);
            const newText = editInput.value.trim();
            
            if (!newText) {
                showNotification('Task cannot be empty!', 'error');
                return;
            }
            
            todos = todos.map(todo => 
                todo.id === id ? {...todo, text: newText} : todo
            );
            
            saveTodos();
            editingId = null;
            renderTodos();
            updateStats();
            
            showNotification('Task updated successfully!');
        }

        // Cancel edit
        function cancelEdit() {
            editingId = null;
            renderTodos();
        }

        // Delete todo
        function deleteTodo(id) {
            if (!confirm('Are you sure you want to delete this task?')) return;
            
            todos = todos.filter(todo => todo.id !== id);
            saveTodos();
            renderTodos();
            updateStats();
            
            showNotification('Task deleted!');
        }

        // Clear all tasks
        function clearAllTasks() {
            if (todos.length === 0) {
                showNotification('No tasks to clear!', 'error');
                return;
            }
            
            if (!confirm('Are you sure you want to delete ALL tasks?')) return;
            
            todos = [];
            saveTodos();
            renderTodos();
            updateStats();
            
            showNotification('All tasks cleared!');
        }

        // Save to localStorage
        function saveTodos() {
            localStorage.setItem('khusnul_todos', JSON.stringify(todos));
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Enter key untuk add task
            document.getElementById('todo-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') addTodo();
            });
            
            // Enter key untuk edit task
            document.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && editingId) {
                    const editInput = document.getElementById(`edit-input-${editingId}`);
                    if (editInput && document.activeElement === editInput) {
                        saveEdit(editingId);
                    }
                }
            });
            
            renderTodos();
            updateStats();
        });
    </script>
</body>
</html>
